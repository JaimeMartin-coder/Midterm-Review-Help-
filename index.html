<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semester 1 Exam (Midterm) Review: Guided Support Index</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f7f3;--fg:#1c2420;--muted:#46524b;--line:#b9c7bd;--card:#ffffff;--soft:#e6efe8;
  --accent:#176a3c;--accentfg:#ffffff;--warn:#a65300;
  --font:Verdana,Tahoma,"Trebuchet MS",sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:100%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121714;--fg:#e8efe9;--muted:#a9b8ae;--line:#33423a;--card:#1a211d;--soft:#222c26;--accent:#6fcf97;--accentfg:#0b1a11;--warn:#f0a35a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121714;--fg:#e8efe9;--muted:#a9b8ae;--line:#33423a;--card:#1a211d;--soft:#222c26;--accent:#6fcf97;--accentfg:#0b1a11;--warn:#f0a35a;color-scheme:dark}
:root[data-theme="light"][data-tint="cream"]{--bg:#fbf5e6;--card:#fffaf0;--soft:#f3ead2;--line:#d4c8a4;--accent:#0b5cab;--warn:#b45309}
:root[data-theme="light"][data-tint="blue"]{--bg:#e8f1fb;--card:#f5f9fe;--soft:#dbe8f6;--line:#b7c9de;--accent:#0b5cab;--warn:#b45309}
:root[data-theme="light"][data-tint="mint"]{--bg:#e6f5ec;--card:#f4fbf7;--soft:#d6ecde;--line:#b4d3c0}

*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:1.0625rem/1.6 var(--font);text-align:left}
:root[data-dys="1"] body{letter-spacing:.05em;word-spacing:.16em;line-height:1.85}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid var(--line)}
.brand{font-weight:700;font-size:1rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:.4rem .9rem;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentfg);font-weight:700}
.btn:focus-visible,.row:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,.seg button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);font-weight:700}
.btn.helpTop{border-color:var(--accent);font-weight:700}

/* option and help panels */
.opts{margin:12px 0;border:2px solid var(--line);border-radius:10px;background:var(--card);padding:14px 16px}
.opts h2{margin:0 0 8px;font-size:1.1rem}
.opts .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.opts .lab{font-weight:700;min-width:7.5rem}
.opts label.chk{display:flex;gap:8px;align-items:center;min-height:44px}
.opts input[type=checkbox]{width:22px;height:22px}
.helpP{border-color:var(--accent);border-width:3px}
.helpP h3{font-size:1.02rem;margin:12px 0 4px}
.helpP p{margin:0 0 6px}
.helpP ol{margin:4px 0 8px;padding-left:1.4rem}
.helpP li{margin:3px 0}
.hl{outline:4px solid var(--warn)!important;outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.hl{animation:hlp 1s ease-in-out 3}@keyframes hlp{50%{outline-color:var(--accent)}}}

h1{font-size:1.75rem;line-height:1.25;margin:24px 0 8px}
#pgTitle:focus{outline:none}
#app:focus{outline:none}
h2.sec{font-size:1.2rem;margin:28px 0 8px}
.lead{color:var(--muted);margin:0 0 12px}
.rule{border:2px solid var(--accent);border-radius:10px;padding:12px 16px;background:var(--card);margin:16px 0}
.rule p{margin:0 0 6px}
.rule ol{margin:6px 0 0;padding-left:1.4rem}
.rule li{margin:4px 0}

/* index rows */
.seg{display:flex;gap:0;margin:16px 0 4px}
.seg button{flex:1 1 0;border:2px solid var(--line);background:var(--card);padding:.5rem .8rem;cursor:pointer;min-height:46px}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentfg);border-color:var(--accent);font-weight:700}
.list{display:grid;gap:8px;margin:8px 0}
.row{display:grid;grid-template-columns:8.5rem 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:8px;padding:.5rem .8rem;min-height:48px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .num{font-weight:700;color:var(--accent);overflow-wrap:anywhere}
.row .done{font-size:.9rem;color:var(--accent);font-weight:700}
@media (max-width:520px){.row{grid-template-columns:6.5rem 1fr auto}}
.progress{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0;color:var(--muted)}
.bar{flex:1 1 160px;height:12px;border:2px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent);width:0}

/* question view */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 0;font-size:.95rem}
.crumbs button{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:8px 4px;min-height:44px}
.qbox{border:2px solid var(--line);border-radius:10px;background:var(--card);padding:14px 16px;margin:10px 0}
.qbox .tag{color:var(--muted);font-size:.95rem;margin:0}
.qbox h1{margin:4px 0 0;font-size:1.35rem}
h2.sub{font-size:1.1rem;margin:22px 0 8px}
.where{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.where li{border-left:5px solid var(--accent);background:var(--card);padding:8px 12px;border-radius:0 8px 8px 0}
.where b{display:block}

/* the hint ladder */
.ladder{margin:10px 0;padding:0;list-style:none;position:relative}
.ladder li{position:relative;margin:0 0 10px;padding:10px 14px 12px 54px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.ladder li .step{position:absolute;left:10px;top:10px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accentfg);font-weight:700;display:grid;place-items:center}
.ladder li b.kind{display:block;margin-bottom:2px}
.ladder li p{margin:0}
.ladder li.retaught{border-color:var(--accent);border-width:3px}
.ladder li.retaught p{margin:0 0 8px}
.ladder li.locked{border-style:dashed;color:var(--muted);background:transparent}
.ladder li.locked .step{background:var(--line);color:var(--fg)}
.helpRow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.checks{list-style:none;margin:0;padding:0}
.checks li{margin:4px 0}
.checks label{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:6px 0;cursor:pointer}
.checks input{width:22px;height:22px;margin-top:3px;flex:none}
.navrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin:28px 0 8px}
.small{font-size:.95rem;color:var(--muted)}

.fig{margin:12px 0;border:2px solid var(--line);border-radius:10px;background:var(--card);padding:10px}
.fig svg{display:block;width:100%;height:auto;color:var(--fg)}
.fig .ln{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fig .th{stroke-width:4}
.fig .dash{stroke-dasharray:7 6}
.fig .fl{fill:var(--soft);stroke:currentColor;stroke-width:2.5}
.fig .wh{fill:var(--card);stroke:currentColor;stroke-width:2.5}
.fig .wh.th,.fig .fl.th{stroke-width:4}
.fig .mk{fill:var(--card);stroke:currentColor;stroke-width:3}
.fig text{fill:currentColor;font-family:inherit;letter-spacing:0;word-spacing:0}
.fig figcaption{margin:8px 0 6px;font-size:.98rem}
.imgh{font-size:1rem;margin:14px 0 4px}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:8px}
.pic{margin:0;border:2px solid var(--line);border-radius:8px;padding:8px;background:var(--card)}
.pic img{display:block;max-width:100%;height:auto;margin:0 auto;background:#fff;border-radius:4px}
.pic figcaption{font-size:.92rem;margin-top:6px}
.usedby{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
@media (prefers-reduced-motion:no-preference){.ladder li.new{animation:pop .35s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.2}to{transform:none;opacity:1}}}

</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="brand">Midterm Review Guided Support Index</span>
    <div class="tools">
      <button class="btn" id="backBtn" type="button" hidden>‹ Back to the index</button>
      <button class="btn helpTop" id="helpBtn" type="button" aria-expanded="false" aria-controls="helpP">What do I do next?</button>
      <button class="btn" id="optBtn" type="button" aria-expanded="false" aria-controls="opts">Reading options</button>
    </div>
  </div>

  <section class="opts helpP" id="helpP" hidden aria-label="What do I do next?">
    <h2>What do I do next?</h2>
    <div id="helpBody"></div>
    <div class="grp"><button class="btn primary" id="showMe" type="button">Show me</button><button class="btn" id="helpClose" type="button">Close help</button></div>
  </section>

  <section class="opts" id="opts" hidden aria-label="Reading options">
    <h2>Reading options</h2>
    <div class="grp"><span class="lab" id="colLab">Page color</span>
      <div class="tools" role="group" aria-labelledby="colLab" id="tintBtns"></div></div>
    <div class="grp"><span class="lab">Text</span>
      <label class="chk"><input type="checkbox" id="dys"> Easier-to-read font and spacing</label></div>
    <div class="grp"><span class="lab" id="szLab">Text size</span>
      <div class="tools" role="group" aria-labelledby="szLab">
        <button class="btn" type="button" id="szDown" aria-label="Make text smaller">A−</button>
        <button class="btn" type="button" id="szUp" aria-label="Make text bigger">A+</button></div></div>
    <div class="grp"><button class="btn" type="button" id="optClose">Close options</button></div>
  </section>

  <main id="app" tabindex="-1"></main>
</div>

/* ===== UNIT 1 ===== */
{id:"q1",tag:"#1",short:"What biology is",q:"What is biology?",
 where:[[U1,"the first page"]],
 h:["Think about the word itself. Many science words end in “-ology.” What does that ending usually mean?","Break the word into two parts: “bio” and “ology.” “Bio” has to do with life. What would you call the study of something?","Try this frame: Biology is the study of ______."],
 c:["My answer says what biology studies.","I wrote a complete sentence."],
 r:["Biology is the study of life and its characteristics. Biologists study living things, from tiny cells to whole ecosystems."]},
{id:"q2",tag:"#2",short:"Six characteristics of life",q:"What are the Six Characteristics of Life? Give one example of each characteristic.",
 where:[[U1,"the part about what makes something alive"]],
 h:["Think about a dog, a tree, and a bacterium. What do all living things do that a rock does not?","Think about these six actions: staying stable on the inside, being built from organized parts, making offspring, growing and developing, changing over many generations to fit an environment, and reacting to the world around them. Name each one, then think of a real living thing that shows it.","Try this frame: Characteristic: ______. Example: a ______ shows it because ______. Do this six times."],
 c:["I named all six characteristics.","Each example is a different, real living thing."],
 r:["The six characteristics of life are homeostasis, organization, reproduction, growth and development, adaptation (evolution), and response to stimulus.","Sample examples: homeostasis, maintaining body temperature; organization, an octopus is made of cells and has symmetry; reproduction, a parrot lays eggs; growth and development, puppies grow into adult dogs; adaptation, a frog is green and blends into its environment; response to stimulus, a student shivers on a cold day without a coat."]},
{id:"q7",tag:"#7",short:"Six kingdoms chart",q:"Fill in a chart that includes the name of each of the 6 kingdoms. Also include whether each is a heterotroph or autotroph (or both), single-celled or multicellular (or both), and whether they are prokaryotes or eukaryotes, and any general characteristic(s) that applies only to that kingdom.",
 where:[[U1,"the section on the six kingdoms"]],
 h:["Think about the six groups of life: two kinds of bacteria, the protists, fungi, plants, and animals. Fill in what you are sure about first, one kingdom at a time.","Work down each column and ask four questions: How does it get food? One cell or many cells? Does it have a nucleus? What is special about it? Start with the kingdoms you know best (plants and animals), then use them to work out the rest.","Try this frame for each kingdom: ______ gets food by ______, is ______-celled, is a (prokaryote / eukaryote), and is known for ______."],
 c:["Every box in my chart is filled in.","I used the chart words correctly: autotroph, heterotroph, prokaryote, eukaryote."],
 r:["Eubacteria: both autotrophs and heterotrophs; single-celled; prokaryote; the common bacteria. Archaebacteria: both; single-celled; prokaryote; live in extreme environments.","Protista: both; single-celled or multicellular; eukaryote; the “misfit” kingdom. Fungi: heterotroph; single-celled or multicellular; eukaryote; no movement, and they are decomposers. Plantae: autotroph; multicellular; eukaryote; has organs and does photosynthesis. Animalia: heterotroph; multicellular; eukaryote; has organs."]},
{id:"s1",tag:"Scenario 1",lab:"Scenario question 1 (under #7)",short:"Many cells, nucleus, makes food",q:"A scientist discovers a new species. It has many cells, each with a well-defined nucleus, and it appears to make its own food using photosynthesis. Which kingdom(s) could this organism be classified as?",
 where:[[S,"your kingdoms chart (#7)"]],
 h:["Use your chart from #7. List every kingdom that makes its own food. Then cross out any kingdom that cannot have many cells.","Each clue narrows the list. “Well-defined nucleus” tells you the cell type. “Many cells” tells you the cell organization. “Makes its own food” tells you the feeding method. Which kingdoms are left after all three clues?","Try this frame: The clues say ______ (prokaryote or eukaryote), ______ (cell organization), and ______ (feeding method). So it could be ______ or ______."],
 c:["I checked my answer against every clue.","I did not leave out a kingdom that fits all the clues."],
 r:["A well-defined nucleus means eukaryote. Many cells means multicellular. Making its own food means autotroph. Protista and Plantae both fit, so this organism could be either one.","Bacteria are out because they have no nucleus. Fungi and animals are out because they cannot make their own food."]},
{id:"s2",tag:"Scenario 2",lab:"Scenario question 2 (under #7)",short:"One cell, makes food",q:"A scientist discovers a new species. It has only one cell, and it appears to make its own food using photosynthesis. Which kingdom(s) could this organism be classified as?",
 where:[[S,"your kingdoms chart (#7)"]],
 h:["Use your chart from #7 again. Which kingdoms can be single-celled? Which of those can make their own food?","Notice what the clues do not say. They do not say whether the cell has a nucleus, so you cannot rule out a kingdom for being a prokaryote or a eukaryote. Which kingdom can you rule out because it needs many cells?","Try this frame: One cell and photosynthesis could be ______, ______, or ______. It cannot be a plant because ______."],
 c:["I did not rule out a kingdom for something the clues do not say.","I can explain why it cannot be a plant."],
 r:["One cell plus making its own food fits three kingdoms: Archaebacteria, Eubacteria, and Protista. The clues do not mention a nucleus, so both prokaryote kingdoms and the eukaryote protists are possible.","It cannot be a plant because plants are always multicellular."]},
{id:"s3",tag:"Scenario 3",lab:"Scenario question 3 (under #7)",short:"Many cells, eats others",q:"A scientist discovers a new species. It has many cells and organ systems, and it appears to feed only off of other organisms. Which kingdom(s) could this organism be classified as?",
 where:[[S,"your kingdoms chart (#7)"]],
 h:["Use your chart from #7. Which kingdoms feed on other organisms? Then use the clue about organ systems: which of those kingdoms has organs?","Two clues work together here. “Feeds only off of other organisms” points to a feeding method. “Many cells and organ systems” points to a very organized body.","Try this frame: It is a ______ (feeding method) with ______ (organization), so it must be in the kingdom ______."],
 c:["I used both clues, not just one.","I chose only the kingdom(s) that fit every clue."],
 r:["Feeding only off other organisms means heterotroph. Fungi and Animalia are both heterotrophs, but only animals have organs and organ systems. So this organism is in Animalia.","Fungi are heterotrophs too, but they do not have organs, so the organ systems clue rules them out."]},
{id:"q8",tag:"#8",short:"Prokaryote vs. eukaryote",q:"What are the two basic cell types? How are they different?",
 where:[[U1,"the part about cell types"]],
 h:["Think about the two main kinds of cells. One kind is found in bacteria. The other is found in plants, animals, fungi, and protists. What is the biggest difference in their structure?","Look at the word parts: “pro” means before and “eu” means true, and “karyon” means nucleus. Which cell type has a true nucleus and organelles? Fill in the chart: nucleus or no nucleus, organelles or no organelles, and what kinds of organisms have each.","Try this frame: A ______ cell has a nucleus and organelles and is usually ______-celled. A ______ cell has no nucleus and no organelles and is usually ______."],
 c:["I compared the two cell types on the nucleus and on organelles.","I named an example organism for each type."],
 r:["The two basic cell types are eukaryotic and prokaryotic. Eukaryotes have a nucleus and organelles and are usually multicellular (animals and plants). Prokaryotes have no nucleus and no organelles and are usually single-celled (bacteria)."]},
{id:"q9",tag:"#9",short:"Levels of organization",q:"Order from largest to smallest: Cell, Organ, Organ System, Organelle, Tissue, Organism.",
 where:[[U1,"the part about levels of organization"]],
 h:["Think about your own body. Which word names the whole living thing? Which word names a tiny part inside a cell?","Start with the whole living thing at one end and the tiny part inside a cell at the other. In between, cells join to make tissue, tissues make organs, and organs work together as systems. Where does each word on the list go?","Try this frame: ______, then ______, then ______, then ______, then ______, then ______ (largest to smallest)."],
 c:["All six words are on my list, each used once.","The first word names the whole living thing."],
 r:["From largest (most complex) to smallest (least complex): Organism, Organ System, Organ, Tissue, Cell, Organelle.","Remember it this way: cells make tissues, tissues make organs, organs make organ systems, and organ systems make an organism. An organelle is a part inside a cell."]},
/* ===== UNIT 2 ===== */
{id:"ct",tag:"Phases table",lab:"Cell cycle phases table (before #10)",short:"Cell cycle phases table",q:"Fill in the table. For each phase of the cell cycle (interphase, prophase, metaphase, anaphase, telophase, cytokinesis), tell what the DNA is doing or what it is called, and describe the phase.",
 where:[[U2,"the cell cycle section"],[G1,"the five phases in order"]],
 h:["Think of the cell cycle as a story told in order. Say the phases out loud in order. Then ask about each one: what is the DNA doing?", "Study Diagram 1. Notice how the DNA changes: loose threads, then coiled X shapes, then lined up, then pulled apart, then loose again. Match each picture to a row in the table. Then look at what the nucleus and the spindle are doing.", "Try this frame for each row: In ______, the DNA is called ______ because ______. The cell ______."],
 c:["I filled in both columns for every row.","The phases are in the correct order."],
 r:["Interphase: DNA is chromatin (uncoiled strands) and is copied. The cell grows, makes proteins, builds organelles, and spends about 90% of its life here. Prophase: DNA is chromosomes (chromatin coils up). Spindle fibers form, centrioles move to opposite ends, and the nuclear envelope and nucleolus disappear. Metaphase: chromosomes. Spindle fibers attach and move the chromosomes to the middle (the equator) of the cell.","Anaphase: chromatids. The centromere splits and the two sister chromatids are pulled to opposite ends of the cell. Telophase: chromatin again. The chromatids uncoil, the nucleolus and nuclear envelope reappear, and the spindle and centrioles break down. Cytokinesis: the cell finally splits into 2 identical daughter cells."]},
{id:"q10",tag:"#10",short:"Longest phase",q:"Of all the phases of the cell cycle, which one is longest?",
 where:[[S,"your phases table"]],
 h:["Think about a cell’s whole life. Does it spend most of its time dividing, or doing its everyday jobs?","Look at the phases table. Which row describes the cell growing, working, and copying its DNA? The phase with the most jobs takes the most time.","Try this frame: The longest phase of the cell cycle is ______, because the cell is ______."],
 c:["My answer is one phase.","I can say what the cell does during that phase."],
 r:["The longest phase is interphase. The cell grows, carries out protein synthesis, builds organelles, and copies its DNA. It spends about 90% of its life in interphase."]},
{id:"q11",tag:"#11",short:"Mitosis and its time",q:"Cell division is called ______ and the cell only spends about ______ of its lifetime doing this.",
 where:[[S,"your answer to #10 and your phases table"]],
 h:["Think back to #10. If one phase is the longest, how much of the cell’s life is left over for dividing?","Use your answer to #10 and your phases table. The table says how much of its life the cell spends in the longest phase. The rest is the time spent dividing. The name for cell division starts with “mito.”","Try this frame: Cell division is called ______ and the cell spends about ______ of its life doing it."],
 c:["I filled in both blanks.","My percentage and my answer to #10 add up to 100%."],
 r:["Cell division is called mitosis, and the cell only spends about 10% of its lifetime doing it. The other 90% is interphase."]},
{id:"q12",tag:"#12",short:"Label the five phases",q:"Label each phase below and tell what number (1-5) it is in the order of the cell cycle. Structure X is called a ______.",
 where:[[G1,"the five phases in order, and the centriole"],[S,"your phases table"]],
 h:["Think about what is different in each picture: where the chromosomes are, whether you can see a nucleus, and where the spindle fibers are.", "Study Diagram 1 and the sheet drawings below it. Interphase: a nucleus with loose DNA. Prophase: coiled chromosomes and a fading nucleus. Metaphase: chromosomes lined up in the middle. Anaphase: chromatids pulled to opposite ends. Telophase: two new nuclei and a pinching cell. On the exam the pictures may be mixed up, so learn what each one looks like. Structure X is the small structure that moves to the ends of the cell and helps form the spindle.", "Try this frame: In the first picture the ______ is visible, so it is ______, step ______. Do the same for the other four. Structure X is a ______."],
 c:["Each phase has both a name and a number from 1 to 5.","Each number is used only once."],
 r:["The order of the cell cycle is Interphase (1), Prophase (2), Metaphase (3), Anaphase (4), Telophase (5). Interphase has a visible nucleus with loose DNA. Prophase has coiling chromosomes. Metaphase has chromosomes lined up in the middle. Anaphase has chromatids pulled apart. Telophase has two new nuclei forming.","Structure X is a centriole. Centrioles move to opposite ends of the cell in prophase, and the spindle fibers form from them."]},
{id:"q13",tag:"#13",short:"Purposes of mitosis",q:"What are the purposes of mitosis?",
 where:[[U2,"the part about why cells divide"]],
 h:["Think about a scraped knee or a growing puppy. Why do the cells in a body need to divide?","Think about three situations: a cell that has worn out, a body that is getting bigger, and a body that has been hurt. What does mitosis do in each one? Also think about how the new cells compare with the old one.","Try this frame: Mitosis (1) replaces ______ cells, (2) helps with ______, (3) makes ______ daughter cells, and (4) helps when the body is ______."],
 c:["I listed more than one purpose.","Each purpose is a different job, not the same idea in new words."],
 r:["Purposes of mitosis: to replace old, worn out, or dead cells; growth and development; to produce identical daughter cells; and to replace cells when injured."]},
{id:"q14",tag:"#14",short:"End result of mitosis",q:"What is the end result of mitosis?",
 where:[[S,"the cytokinesis row of your phases table"]],
 h:["Think about one cell that divides. How many cells do you have afterward? How do they compare with the first cell?","Look at the last row of your phases table. It tells you what the cell finally splits into.","Try this frame: The end result of mitosis is ______ daughter cells that are ______."],
 c:["My answer says how many cells there are.","My answer says how the new cells compare with each other."],
 r:["The end result of mitosis is two identical daughter cells, each with the same DNA as the original cell."]},
{id:"q15",tag:"#15",short:"Draw a chromosome",q:"Draw a diagram below that shows a centromere, sister chromatids, and a chromosome.",
 where:[[G2,"the chromosome picture"],[U2,"the picture of a chromosome"]],
 h:["Think about what a chromosome looks like right before a cell divides: copied DNA shaped like an X. What are its parts?", "Study Diagram 2. A copied chromosome looks like an X. The two side-by-side halves are identical copies, and they are joined at a pinched spot. Find the name for each of these parts in the picture.", "Try this frame: Draw an X shape. Label the whole X ______. Label each half ______. Label the pinched middle ______."],
 c:["My drawing shows one whole chromosome made of two copies.","I labeled the centromere, the sister chromatids, and the chromosome."],
 r:["The whole X is a chromosome. Each of the two identical halves is a sister chromatid. The place where the sister chromatids are joined, the pinched spot in the middle, is the centromere.", "Diagram 2 labels all three parts. Practice drawing it from memory."]},
{id:"q16",tag:"#16",short:"Uncoiled DNA",q:"Uncoiled DNA during interphase is called ______.",
 where:[[S,"the interphase row of your phases table"]],
 h:["Think about a long thread of yarn. Before the cell divides, is the DNA tightly coiled or loose?","Look at the interphase row of your phases table, in the column about what the DNA is called. In interphase the DNA is uncoiled in strands around proteins.","Try this frame: Uncoiled DNA during interphase is called ______."],
 c:["I wrote one word.","I can say how it is different from a chromosome."],
 r:["Uncoiled DNA during interphase is called chromatin. When it coils up during prophase, it becomes chromosomes."]},
{id:"q17",tag:"#17",short:"Opposite phases",q:"What two phases seem to have opposite events during mitosis?",
 where:[[S,"your phases table"]],
 h:["Think about what gets built up and what gets taken apart. Which events happen in one phase and then get undone in a later phase?","Compare the rows of your phases table. In one phase the nuclear envelope and nucleolus disappear, the chromatin coils up, and the spindle forms. Which phase does the exact opposite?","Try this frame: In ______ the nuclear envelope disappears and the spindle forms. In ______ the nuclear envelope returns and the spindle breaks down."],
 c:["I named two phases.","I can explain one event that is reversed."],
 r:["Prophase and telophase have opposite events. In prophase the chromatin coils into chromosomes, the spindle forms, and the nuclear envelope and nucleolus disappear. In telophase the chromatids uncoil into chromatin, the spindle breaks down, and the nuclear envelope and nucleolus reappear."]},
{id:"q18",tag:"#18",short:"What regulates the cell cycle",q:"What molecules help regulate the cell cycle?",
 where:[[U2,"the part about controlling the cell cycle"],[S,"the wording of #21 and #31"]],
 h:["Think about what controls the timing of the cell cycle. Something has to tell the cell when to copy its DNA and when to divide. What kind of molecule does jobs like that?","Read question #21. It talks about the DNA code for making a certain kind of molecule. Then read question #31. It asks what that kind of molecule does to biological reactions.","Try this frame: The cell cycle is regulated by special proteins called ______."],
 c:["I wrote the name of one kind of molecule.","I can say why that molecule matters in this unit."],
 r:["Enzymes help regulate the cell cycle. Enzymes are special proteins that control biological processes, so they help tell the cell when to copy its DNA and when to divide."]},
{id:"q19",tag:"#19",short:"When DNA is copied",q:"DNA is replicated/duplicated during ______.",
 where:[[S,"your phases table and your answer to #10"]],
 h:["Think about when the DNA has to be copied: before the cell divides or after?","Look at the interphase row of your phases table. It says what happens to the DNA during this phase. Also check your answer to #10.","Try this frame: DNA is replicated (copied) during ______, before the cell divides."],
 c:["I wrote the name of one phase.","I can explain why the copy has to happen first."],
 r:["DNA is replicated (duplicated) during interphase, before the cell starts mitosis. That way each daughter cell can get a full copy."]},
{id:"q20",tag:"#20",short:"Uncontrolled cell division",q:"Uncontrolled cell division can cause ______.",
 where:[[U2,"the cancer section"]],
 h:["Think about what happens when the controls on cell division fail and cells keep dividing when they should stop.","Think about what a group of cells that will not stop dividing can turn into. It is a disease you studied in this unit.","Try this frame: Uncontrolled cell division can cause ______."],
 c:["I wrote one word.","I can say what is going wrong in the cells."],
 r:["Uncontrolled cell division can cause cancer."]},
{id:"q21",tag:"#21",short:"Error in the DNA",q:"An error in the DNA which codes for enzyme production is called a ______.",
 where:[[U2,"the cancer section"]],
 h:["Think about DNA as a set of instructions. What do we call a mistake in the instructions?","The word starts with “mu.” It is a change in the DNA sequence. In the cancer section, look for what can cause these changes.","Try this frame: An error in the DNA is called a ______."],
 c:["I wrote one word.","I can say how it connects to cancer."],
 r:["An error in the DNA which codes for enzyme production is called a mutation. A mutation can cause cells to divide when they should not."]},
{id:"q22",tag:"#22",short:"Cancer spreading",q:"When cancer spreads from one organ to another organ this is called ______.",
 where:[[U2,"the cancer section"]],
 h:["Think about what makes cancer so dangerous. What happens when cancer cells leave the place where they first grew?","The word begins with “meta.” It names what happens when cancer moves from one organ to another organ.","Try this frame: When cancer spreads from one organ to another organ, it is called ______."],
 c:["I wrote one word.","I can describe what is happening in the body."],
 r:["When cancer spreads from one organ to another organ, it is called metastasis."]},
{id:"q23",tag:"#23",short:"Reducing cancer risk",q:"What are some of the things we can do to reduce our risk of cancer?",
 where:[[U2,"the part about cancer risk and prevention"]],
 h:["Think about things in daily life that can damage DNA, and about choices that protect it.","Think about three areas: what you put in your body, what your skin is exposed to, and what is in the air around you. Also think about shots that protect you from some viruses.","Try this frame: To reduce my risk of cancer, I can ______, ______, and ______."],
 c:["I listed more than one thing.","Each thing I listed is a choice a person can make."],
 r:["Ways to reduce cancer risk: do not smoke, eat lots of fruits and vegetables, wear sunscreen, reduce pollution, and get vaccinations."]},
/* ===== UNIT 3 ===== */
{id:"mm",tag:"Macro table",lab:"Macromolecule table (before #24)",short:"Macromolecule table",q:"What are the four major macromolecules? What is each macromolecule made of (monomer)? Give an example of each (foods) and list the uses in the human body in the table.",
 where:[[U3,"the macromolecules section"]],
 h:["Think about the four big molecules in your food and in your body. One is made of sugars, one is made of amino acids, one includes fats and oils, and one is found in DNA.","Work across each row: the name, then the small building block it is made of, then foods that contain it, then what your body uses it for. Picture a food you eat, like bread, beans, butter, or a steak.","Try this frame: ______ is made of ______ (monomer). Foods: ______. It is used in the body for ______."],
 c:["All four rows have all four columns filled in.","Each food example is in the right row."],
 r:["Protein: monomer amino acid; foods such as meat and beans; uses are building muscle, the immune system, and vessels. Carbohydrate: monomer monosaccharide (simple sugar, such as glucose); foods such as candy, veggies, fruits, pasta, and breads; use is short-term energy.","Lipids: monomer glycerol plus 3 fatty acids; foods such as oils, waxes, and butter; uses are long-term energy storage and insulation. Nucleic acids: monomer nucleotide; DNA and RNA are in every living thing (amounts are too small for nutrition labels); use is the genetic code."]},
{id:"q24",tag:"#24",short:"Monomer vs. polymer",q:"What is the difference between a monomer and a polymer?",
 where:[[S,"the monomer column of your macromolecule table"]],
 h:["Think about a chain made of links. What is one link called, and what is the whole chain called?","“Mono” means one and “poly” means many. Use the monomer column of your macromolecule table to think of an example of a single unit.","Try this frame: A monomer is ______. A polymer is ______. Example: ______ is a monomer and ______ is a polymer."],
 c:["I explained both words.","I gave an example for each."],
 r:["A monomer is a basic building block, a single unit of a polymer. Example: glucose. A polymer is a chain of monomers (building blocks). Example: starch."]},
{id:"m25",tag:"#25 Match",lab:"Question 25 (matching the monomers)",short:"Match the monomers",q:"Match the following monomers with their name: monosaccharide, fatty acid chain, amino acid, nucleotide (pictures a to d).",
 where:[[G5,"the four pictures a to d"],[U3,"the pictures of the four building blocks"]],
 h:["Think about the four monomers in your macromolecule table. Each one has a feature that makes it easy to spot in a picture.","Look for these features: a long chain of carbons with hydrogens, a ring with OH groups, a small molecule with an NH₃ group and an acid group, and a structure with a phosphate, a sugar, and a ring-shaped base. Which picture shows which?","Try this frame: Picture ___ has a long chain, so it is the ______. Picture ___ has a ring with OH groups, so it is the ______. Do the same for the other two."],
 c:["Each picture is used only once.","I can name one feature that matches each picture to its name."],
 r:["The matches are: a is the fatty acid chain (a long chain of carbons with hydrogens), b is the monosaccharide (a ring-shaped sugar with OH groups), c is the nucleotide (a phosphate, a sugar, and a base), and d is the amino acid (a small molecule with an amino group and an acid group).","In the order of the list: monosaccharide = b, fatty acid chain = a, amino acid = d, nucleotide = c."]},
{id:"q25",tag:"#25",lab:"Question 25 (special proteins)",short:"Special proteins",q:"What groups of special proteins help regulate all biological processes?",
 where:[[U3,"the enzymes section"],[G3,"the enzyme pictures"]],
 h:["Think about the reactions in your body, like digesting food. What kind of protein helps these reactions happen quickly?","Many of these proteins have names that end in “-ase,” like lactase and amylase. Think about what they do to the speed of a reaction.","Try this frame: The special proteins that help regulate all biological processes are called ______."],
 c:["I wrote one word.","I can say what these proteins do."],
 r:["The special proteins that help regulate all biological processes are enzymes."]},
{id:"q26",tag:"#26",short:"Tube to the stomach",q:"What is the name of the tube that your food travels down to get into the stomach?",
 where:[[G4,"the tube at the top (A)"]],
 h:["Think about swallowing. After your mouth, where does the food go before it reaches the stomach?", "Look at Diagram 4. The tube at the top leads to the stomach. Your food travels down it after you swallow. Say its name out loud and say what it does.", "Try this frame: Food travels down the ______ to get into the stomach."],
 c:["I wrote the name of a tube, not an organ like the stomach.","I checked my spelling."],
 r:["The tube is the esophagus. Food moves down the esophagus into the stomach. In Diagram 4 it is marked A."]},
{id:"q27",tag:"#27",short:"Hydrochloric acid",q:"What part of the digestive system contains hydrochloric acid?",
 where:[[G4,"the large organ (B)"]],
 h:["Think about where food gets broken down with strong acid. Which organ is a muscular bag that churns food?", "Look at Diagram 4. The large, J-shaped organ is where food goes after the tube. Say its name out loud and say what happens to food there.", "Try this frame: Hydrochloric acid is found in the ______."],
 c:["I wrote the name of one organ.","I can say what the acid does to food."],
 r:["Hydrochloric acid is found in the stomach. In Diagram 4 the stomach is marked B."]},
{id:"q28",tag:"#28",short:"Absorbing nutrients",q:"What part of the digestive system absorbs nutrients from food?",
 where:[[G4,"the long tube (D)"]],
 h:["Think about where the nutrients from your food finally get into your blood.", "This organ is a very long, narrow tube after the stomach. Its name has the word “small” in it because it is narrow. Find it in Diagram 4.", "Try this frame: Nutrients are absorbed in the ______."],
 c:["I wrote the full name of the organ.","I can say why nutrients are absorbed there."],
 r:["Nutrients from food are absorbed in the small intestine. In Diagram 4, the tube marked D is part of the small intestine."]},
{id:"q29",tag:"#29",short:"Helping digest fats",q:"What molecule is produced in the liver and helps to digest lipids?",
 where:[[G4,"the large organ (F) and the small pouch (E)"]],
 h:["Think about how oil and water do not mix. Something has to break big drops of fat into smaller drops.", "Look at Diagram 4. The large organ makes this molecule, and the small pouch under it stores it until it is needed. The question asks for the molecule, not the organ.", "Try this frame: The liver makes ______, which helps to digest lipids."],
 c:["I named a molecule, not an organ.","I can say what it does to fats."],
 r:["The liver produces bile, which helps to digest lipids (fats) by breaking big fat drops into smaller drops. The gall bladder stores the bile. Enzymes also help digest lipids.","In Diagram 4, the liver is F and the gall bladder is E."]},
{id:"q30",tag:"#30",short:"Absorbing water",q:"What digestive organ is the area where most of our water is absorbed?",
 where:[[U3,"the digestive system section"],[G4,"the large intestine (G)"]],
 h:["Think about the very end of the digestive tract. What is left after the nutrients have been absorbed? Where does the body take back the water?", "There are two intestines. One is long and narrow and absorbs nutrients. The other is shorter and wider and finishes the job. Find both in Diagram 4. Which one finishes the job, and what does its name say about its width?", "Try this frame: Most of our water is absorbed in the ______."],
 c:["I wrote the full name of the organ.","My answer is different from my answer to #28."],
 r:["Most of our water is absorbed in the large intestine. The small intestine absorbs nutrients, and the large intestine absorbs water from the leftover material."]},
{id:"q31",tag:"#31",short:"What an enzyme is",q:"What is an enzyme? What do enzymes do to biological reactions?",
 where:[[U3,"the enzymes section"],[G3,"the enzyme pictures"]],
 h:["Think about your answer to #25. Enzymes belong to one of the four macromolecules. Which one?","Reactions in cells can be very slow without help. Look at Diagram 3. The enzyme is not used up. What does it do to the reaction?","Try this frame: An enzyme is a ______ that ______ biological reactions."],
 c:["I said what kind of molecule an enzyme is.","I said what enzymes do to reactions."],
 r:["Enzymes are a category of proteins that help regulate processes in the body. Specifically, they help speed up reactions.","In Diagram 3 the enzyme is not used up. It helps the substrate change into products and is ready to work again."]},
{id:"q32",tag:"#32",short:"Enzyme-substrate drawing",q:"Draw a simple diagram of an Enzyme-Substrate Complex. Label Enzyme, Substrate, Active Site.",
 where:[[G3,"the enzyme pictures"]],
 h:["Think of a lock and a key. Which part of the picture is like the lock, and which part is like the key?", "Study Diagram 3. The large shape is the one that does the work. It has a notch where something fits, like a lock and key. The piece that fits in the notch is the one that gets changed. When the two are joined, they form a complex. Find each name in the picture, then practice drawing it from memory.", "Try this frame: Draw the big shape and label it ______. Draw the notch and label it ______. Draw the piece that fits in the notch and label it ______."],
 c:["My drawing shows the pieces joined together.","I labeled the enzyme, the substrate, and the active site."],
 r:["The big shape is the enzyme. The notch in the enzyme is the active site. The piece that fits into the notch is the substrate. When they join, they form the enzyme-substrate complex.", "After the reaction, the products are released and the enzyme can be used again."]},
{id:"q33",tag:"#33",short:"Destroying enzymes",q:"What are some of the factors that can destroy enzymes (denaturing) and cause them to not work properly? List at least three.",
 where:[[U3,"the part about enzymes and denaturing"]],
 h:["Think about what happens to an egg white when you cook it. It changes shape and cannot change back.","An enzyme only works if it keeps its shape. Think about conditions that can change the shape of a protein: something hot, something very sour, and something at the other end of the pH scale.","Try this frame: Enzymes can be denatured by ______, ______, and ______."],
 c:["I listed at least three factors.","I can say what denature means."],
 r:["Factors that can denature (destroy) enzymes are heat, acids, and bases. When an enzyme is denatured it loses its shape and cannot work properly."]},
{id:"q34",tag:"#34",short:"Label the digestive organs",q:"Look at the diagram. What are the organs marked A to F?",
 where:[[G4,"the letters A to F match the letters on your sheet"]],
 h:["Think about the path of food: mouth, a tube, the stomach, then the intestines. Other organs help with digestion, but food does not pass through them.", "Study Diagram 4 and the picture from your sheet. Follow the path of food: tube, stomach, then intestine. Then find the three helper organs: the large organ, the small pouch, and the long organ near the stomach. Your answers to #26 to #30 can help.", "Try this frame: A is the ______. B is the ______. C is the ______. D is the ______. E is the ______. F is the ______."],
 c:["Each letter has a different organ.","Food travels through A, B, and D, in that order."],
 r:["A is the esophagus. B is the stomach. C is the pancreas. D is the small intestine. E is the gall bladder. F is the liver.","The esophagus, stomach, and small intestine are where food travels. The liver, gall bladder, and pancreas are helper organs: the liver makes bile, the gall bladder stores it, and the pancreas makes digestive enzymes."]},
{id:"q35",tag:"#35",short:"Weightlifter’s food",q:"Which macromolecule should a weightlifter eat in order to build muscle?",
 where:[[S,"the Uses in Human Body column of your macromolecule table"]],
 h:["Think about what it takes to build muscle. Muscles are made mostly of one kind of macromolecule.","Look at the Uses in Human Body column of your macromolecule table. Which row mentions muscle?","Try this frame: A weightlifter should eat ______ to build muscle."],
 c:["I named a macromolecule, not a single food.","I can say why that macromolecule helps build muscle."],
 r:["A weightlifter should eat protein to build muscle. Proteins are made of amino acids, and good food sources include meat and beans."]},
/* ===== UNIT 4 ===== */
{id:"q36",tag:"#36",short:"What ATP is",q:"What is ATP? What do the letters stand for?",
 where:[[U4,"the ATP and energy section"],[G6,"the whole drawing"]],
 h:["Think about a rechargeable battery. What do cells need in order to store energy and use it later?", "ATP is a short name for a three-part word. “Adenosine” is the first part. The middle letter stands for a number prefix. The last letter stands for what is attached to the adenosine. Look at the chain of circles in Diagram 6 to see what is attached.", "Try this frame: ATP is a molecule that ______. A stands for ______, T stands for ______, and P stands for ______."],
 c:["I said what ATP does.","I wrote out what all three letters stand for."],
 r:["ATP is an energy-storing molecule used by organisms. A = adenosine, T = tri (three), P = phosphate. ATP is adenosine triphosphate.", "In Diagram 6, the chain of circles beside the block is the three phosphates."]},
{id:"q37",tag:"#37",short:"Parts of ATP",q:"What are the parts of the ATP molecule?",
 where:[[G6,"the block and the chain of circles"]],
 h:["Think about the full name, adenosine triphosphate. The name itself lists two kinds of parts.", "Study Diagram 6. It shows two kinds of parts: one large block and a chain of circles. Adenosine is made of two pieces: a base and a sugar. How many circles are there?", "Try this frame: ATP is made of ______ (which has ______ and ______) and ______ phosphate groups."],
 c:["I named both kinds of parts.","I said how many phosphate groups there are."],
 r:["The parts of an ATP molecule are adenosine (made of adenine and a sugar) and three phosphate groups. In Diagram 6, the block is the adenosine and each circle is a phosphate."]},
{id:"q38",tag:"#38",short:"Storing and releasing energy",q:"Where is the energy stored in the ATP molecule? How do cells release that energy?",
 where:[[G6,"the squiggly bonds between the circles"]],
 h:["Think about a stretched spring. Energy is held in something that is under tension. In ATP, what part holds the energy?", "Look at Diagram 6. The squiggly lines between the circles are the bonds that hold the energy. What do the circles stand for? What would happen to the energy if one bond broke?", "Try this frame: Energy is stored in the ______ of ATP. Cells release it by ______ them."],
 c:["My answer has two parts: where the energy is stored and how it is released.","I used the word phosphate."],
 r:["Energy is stored in the phosphate bonds, the bonds between the phosphate groups. Cells release the energy by breaking those bonds.", "In Diagram 6, the squiggly lines are those bonds."]},
{id:"q39",tag:"#39",short:"Sugar that makes ATP",q:"What sugar molecule can be broken down and converted into ATP energy?",
 where:[[S,"your answer to #42"]],
 h:["Think about food as fuel. Which sugar does a cell break down to make ATP?","Look at your answer to #42, the products of photosynthesis. One sugar is made in photosynthesis and used in cellular respiration. Its formula is C₆H₁₂O₆.","Try this frame: Cells break down the sugar ______ to make ATP."],
 c:["I named a sugar.","I can say where the sugar comes from."],
 r:["The sugar molecule that can be broken down and converted into ATP energy is glucose (C₆H₁₂O₆)."]},
{id:"q40",tag:"#40",short:"ADP and AMP",q:"What is ADP? AMP?",
 where:[[G6,"the three rows"]],
 h:["Think about the name ATP. If you take away a phosphate, what is left? And if you take away another one?", "Look at Diagram 6. The three rows show the same molecule with three, two, and one phosphate. The prefix in each name tells you the number: mono = 1, di = 2, tri = 3.", "Try this frame: ADP is adenosine ______ and has ___ phosphates. AMP is adenosine ______ and has ___ phosphate."],
 c:["I wrote out the full name of both molecules.","I said how many phosphates each one has."],
 r:["ADP is adenosine diphosphate (2 phosphates). AMP is adenosine monophosphate (1 phosphate). ATP, ADP, and AMP are the same molecule with different numbers of phosphates."]},
{id:"q41",tag:"#41",short:"Most stored energy",q:"Which has the most stored energy: ATP, ADP, or AMP?",
 where:[[G6,"the three rows"]],
 h:["Think about a battery that is fully charged compared with one that is half used.","Think about your answers to #38 and #40. If energy is stored in the bonds between phosphates, which molecule has the most of them?","Try this frame: ______ has the most stored energy because it has ______ phosphates."],
 c:["I picked one molecule.","I can explain my choice using phosphate bonds."],
 r:["ATP has the most stored energy because it has three phosphates and the most phosphate bonds. ADP has less, and AMP has the least."]},
{id:"q42",tag:"#42",short:"Products of photosynthesis",q:"What are the products of photosynthesis?",
 where:[[G9,"the top picture"],[U4,"the photosynthesis section"],[PK,"the equation for photosynthesis"]],

/* ---------- helpers ---------- */
function el(tag,attrs){
  var e=document.createElement(tag),k,j,c;
  if(attrs)for(k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="text")e.textContent=attrs[k];
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==false&&attrs[k]!==null&&attrs[k]!==undefined)e.setAttribute(k,attrs[k]===true?"":attrs[k]);
  }
  for(j=2;j<arguments.length;j++){c=arguments[j];if(c==null)continue;e.appendChild(typeof c==="string"?document.createTextNode(c):c)}
  return e;
}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function applySettings(){

}

var canSpeak=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);

/* ---------- diagram helpers and drawings ---------- */
function T(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.s||16)+'" text-anchor="'+(o.a||"start")+'"'+(o.b?' font-weight="700"':'')+'>'+s+'</text>'}
function L(x1,y1,x2,y2,c){return '<line class="'+(c||"ln")+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>'}
function P(d,c){return '<path class="'+(c||"ln")+'" d="'+d+'"/>'}
function E(cx,cy,rx,ry,c){return '<ellipse class="'+(c||"wh")+'" cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/>'}
function C(cx,cy,r,c){return '<circle class="'+(c||"wh")+'" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>'}
function R(x,y,w,h,rx,c){return '<rect class="'+(c||"wh")+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx||0)+'"/>'}
function DOT(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="3.2" fill="currentColor"/>'}
function AR(x1,y1,x2,y2){var a=Math.atan2(y2-y1,x2-x1),h=13,w=.45;
  var bx=x2-h*Math.cos(a),by=y2-h*Math.sin(a);
  return L(x1,y1,bx,by,"ln th")+'<polygon fill="currentColor" points="'+x2+','+y2+' '+(x2-h*Math.cos(a-w))+','+(y2-h*Math.sin(a-w))+' '+(x2-h*Math.cos(a+w))+','+(y2-h*Math.sin(a+w))+'"/>'}
function MK(shape,x,y){
  var t={circle:"circle marker",square:"square marker",triangle:"triangle marker",diamond:"diamond marker",star:"star marker"}[shape];
  var g;
  if(shape==="circle")g='<circle class="mk" cx="'+x+'" cy="'+y+'" r="14"/>';
  else if(shape==="square")g='<rect class="mk" x="'+(x-13)+'" y="'+(y-13)+'" width="26" height="26"/>';
  else if(shape==="triangle")g='<polygon class="mk" points="'+x+','+(y-17)+' '+(x+16)+','+(y+12)+' '+(x-16)+','+(y+12)+'"/>';
  else if(shape==="diamond")g='<polygon class="mk" points="'+x+','+(y-17)+' '+(x+17)+','+y+' '+x+','+(y+17)+' '+(x-17)+','+y+'"/>';
  else{var pts=[],k;for(k=0;k<10;k++){var r=k%2?7.5:18,a=-Math.PI/2+k*Math.PI/5;pts.push((x+r*Math.cos(a)).toFixed(1)+","+(y+r*Math.sin(a)).toFixed(1))}g='<polygon class="mk" points="'+pts.join(" ")+'"/>'}
  return '<g><title>'+t+'</title>'+g+'</g>'}
function LEAD(x1,y1,x2,y2){return L(x1,y1,x2,y2,"ln")+DOT(x2,y2)}
function bz(a,b,c,d,t){var u=1-t;return[u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0],u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]]}

function svgPlant(){
  var s="",i;
  s+='<rect x="0" y="338" width="640" height="152" fill="var(--soft)"/>';
  [[40,362],[110,392],[88,458],[300,366],[330,432],[372,384],[260,474],[150,352],[22,424],[388,470],[600,470],[610,360]].forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="currentColor"/>'});
  s+=L(0,338,640,338,"ln th");
  // sun
  s+=C(60,62,24,"wh th");
  for(i=0;i<8;i++){var a=i*Math.PI/4;s+=L(60+33*Math.cos(a),62+33*Math.sin(a),60+47*Math.cos(a),62+47*Math.sin(a),"ln th")}
  // roots

var FIGKEYS=["cycle","chrom","enzyme","digest","mono","atp","plant","leaf","inout","gtemp","gph","glight","gcycle","gatp"];
function figEl(k,withLink){
  var f=FIGS[k],box=el("figure",{class:"fig"});
  if(f.svg){
    var wrap=document.createElement("div");
    wrap.innerHTML='<svg viewBox="'+f.vb+'" role="img" aria-label="'+f.alt+'" xmlns="http://www.w3.org/2000/svg">'+f.svg()+'</svg>';
    box.appendChild(wrap.firstChild);
  }
  box.appendChild(el("figcaption",{},el("b",{text:f.t}),el("span",{text:" "+f.key})));
  if(f.imgs){
    box.appendChild(el("h3",{class:"imgh",text:f.imgh||"As they look on your review sheet"}));
    var g=el("div",{class:"imgs"});
    f.imgs.forEach(function(m){
      var fg=el("figure",{class:"pic"});
      fg.appendChild(el("img",{src:IMG[m.k],alt:m.n+". "+m.c}));
      fg.appendChild(el("figcaption",{},el("b",{text:m.n}),el("span",{text:" "+m.c})));
      g.appendChild(fg);
    });
    box.appendChild(g);
  }
  if(withLink)box.appendChild(el("button",{class:"btn",type:"button",text:"Open this bigger",onclick:function(){go("fig-"+k)}}));
  return box}

/* ---------- views ---------- */
var mode="order";
var shown={};      // hints shown per question, this visit only
var cur={view:"index",d:null,k:null};
function go(id){location.hash=id}
function doneCount(){var n=0;D.forEach(function(d){if(done[d.id])n++});return n}
function labOf(d){return d.lab||("Question "+d.tag.slice(1))}
function crumbOf(d){return d.lab?d.tag+": "+d.short:"Question "+d.tag.slice(1)}

function rowFor(d){
  var isQ=d.id.charAt(0)==="q"&&/^q\d+$/.test(d.id)&&d.id!=="q25";
  return el("button",{class:"row",type:"button","data-q":"1","data-done":done[d.id]?"1":"0",onclick:function(){go(d.id)}},
    el("span",{class:"num",text:d.tag}),
    el("span",{text:d.short}),
    el("span",{class:"done",text:done[d.id]?"Done":""}));
}

function viewIndex(){
  cur={view:"index",d:null,k:null};
  app.innerHTML="";
  var n=doneCount(),total=D.length,pct=Math.round(n/total*100);
  var bar=el("i");bar.style.width=pct+"%";
  app.appendChild(el("h1",{id:"pgTitle",tabindex:"-1",text:"Semester 1 Exam (Midterm) Review"}));
  app.appendChild(el("p",{class:"lead",text:"Guided Support Index. Find your question, try it first, and get help one step at a time."}));
  app.appendChild(el("div",{class:"rule"},
    el("p",{},el("b",{text:"This guide helps you find the answer. Try each question on your own first."})),
    el("ol",{},
      el("li",{text:"Find the question you are working on."}),
      el("li",{text:"Try it first, even if you only know a little."}),
      el("li",{text:"Press Help to get one hint at a time. After all three hints, you can ask for a reteach."}),
      el("li",{text:"Use the self-check list before you move on."}),
      el("li",{text:"Lost? Press “What do I do next?” at the top of any page."}))));
  var prog=el("div",{class:"progress"},
    el("span",{text:n+" of "+total+" marked done"}),
    el("span",{class:"bar",role:"img","aria-label":pct+" percent done"},bar));
  if(n>0){
    var clr=el("button",{class:"btn",type:"button",text:"Clear my Done marks"});
    var armed=false,tm=null;
    clr.addEventListener("click",function(){
      if(!armed){armed=true;clr.textContent="Press again to clear";tm=setTimeout(function(){armed=false;clr.textContent="Clear my Done marks"},4000)}
      else{clearTimeout(tm);done={};lsSet("mgi-done",done);viewIndex();focusTitle()}
    });
    prog.appendChild(clr);
  }
  app.appendChild(prog);

  app.appendChild(el("div",{class:"seg",id:"sortSeg",role:"group","aria-label":"How to sort the list"},
    el("button",{type:"button","aria-pressed":mode==="order"?"true":"false",text:"In review sheet order",onclick:function(){mode="order";viewIndex();focusTitle()}}),
    el("button",{type:"button","aria-pressed":mode==="topic"?"true":"false",text:"By topic",onclick:function(){mode="topic";viewIndex();focusTitle()}})));

  if(mode==="topic"){
    SECTIONS.forEach(function(s){
      app.appendChild(el("h2",{class:"sec",text:s.t}));
      var l=el("div",{class:"list"});
      s.ids.forEach(function(id){l.appendChild(rowFor(BY[id]))});
      app.appendChild(l);
    });
  }else{
    UNITS.forEach(function(u,j){
      var a=BY[u[1]].idx,b=UNITS[j+1]?BY[UNITS[j+1][1]].idx:D.length;
      app.appendChild(el("h2",{class:"sec",text:u[0]}));
      var l=el("div",{class:"list"});
      D.slice(a,b).forEach(function(d){l.appendChild(rowFor(d))});
      app.appendChild(l);
    });
  }
  app.appendChild(el("h2",{class:"sec",text:"Pictures and graphs to know"}));
  app.appendChild(el("p",{class:"lead",text:"Study the labels, then cover them and test yourself. You will need to recognize these on the exam."}));
  var dl=el("div",{class:"list"});
  FIGKEYS.forEach(function(k,j){dl.appendChild(el("button",{class:"row",type:"button",onclick:function(){go("fig-"+k)}},el("span",{class:"num",text:FIGS[k].t.split(":")[0]}),el("span",{text:FIGS[k].t.replace(/^(Diagram|Graph) \d+: /,"")}),el("span")))});
  app.appendChild(dl);
  app.appendChild(el("p",{class:"small",text:"Your Done marks and reading options are saved on this device only."}));
}

function viewQuestion(d){
  cur={view:"question",d:d,k:null};
  app.innerHTML="";
  var st=shown[d.id]||0;
  app.appendChild(el("nav",{class:"crumbs","aria-label":"You are here"},
    el("button",{type:"button",text:"Index",onclick:function(){go("index")}}),
    el("span",{text:"›"}),
    el("span",{text:crumbOf(d)})));

  app.appendChild(el("div",{class:"qbox"},
    el("p",{class:"tag",text:labOf(d)}),
    el("h1",{id:"pgTitle",tabindex:"-1",text:d.q})));

  var tools=el("div",{class:"helpRow"});
  if(canSpeak){
    tools.appendChild(el("button",{class:"btn",type:"button",text:"Read this page aloud",onclick:function(){speak(readText(d))}}));
    tools.appendChild(el("button",{class:"btn",type:"button",text:"Stop reading",onclick:stopSpeech}));
  }
  var dn=el("button",{class:"btn",id:"doneBtn",type:"button","aria-pressed":done[d.id]?"true":"false",text:done[d.id]?"Marked done. Press again to undo.":"I finished this one",onclick:function(){
    if(done[d.id])delete done[d.id];else done[d.id]=1;
    lsSet("mgi-done",done);
    dn.setAttribute("aria-pressed",done[d.id]?"true":"false");
    dn.textContent=done[d.id]?"Marked done. Press again to undo.":"I finished this one";
  }});
  tools.appendChild(dn);
  app.appendChild(tools);

  if(d.where.length){
    app.appendChild(el("h2",{class:"sub",text:"Where to look"}));
    var w=el("ul",{class:"where"});
    d.where.forEach(function(x){w.appendChild(el("li",{},el("b",{text:x[0]}),x[1]))});
    app.appendChild(w);
  }
  var used=[];FIGKEYS.forEach(function(k){if(FIGS[k].use.indexOf(d.id)>-1)used.push(k)});
  if(used.length){
    app.appendChild(el("h2",{class:"sub",text:used.length>1?"Pictures to study":"Picture to study"}));
    app.appendChild(el("p",{class:"small",text:"Study each picture until you can recognize every part. Then cover the labels and test yourself."}));
    used.forEach(function(k){app.appendChild(figEl(k,true))});
  }

  app.appendChild(el("h2",{class:"sub",text:"Need help? Try the question first."}));
  var ladder=el("ol",{class:"ladder","aria-live":"polite"});
  var KINDS=["Think back","Look here","Build it"];
  var hrow=el("div",{class:"helpRow",id:"helpRow"});
  function rung(n,kind,body,cls){
    return el("li",{class:cls||""},el("span",{class:"step","aria-hidden":"true",text:String(n)}),el("b",{class:"kind",text:kind}),body);
  }
  function paint(fresh){
    ladder.innerHTML="";
    var k,sh=shown[d.id]||0;
    for(k=0;k<3;k++){
      if(k<sh){
        ladder.appendChild(rung(k+1,"Hint "+(k+1)+": "+KINDS[k],el("p",{text:d.h[k]}),fresh&&k===sh-1?"new":""));
      }else{
        ladder.appendChild(rung(k+1,"Hint "+(k+1)+": "+KINDS[k],el("p",{text:k===sh?"Ready when you are.":"Locked until you use the hint before it."}),"locked"));
      }
    }
    if(sh>=4){
      var body=el("div",{});
      d.r.forEach(function(t){body.appendChild(el("p",{text:t}))});
      body.appendChild(el("p",{},el("b",{text:"Now go back to the question and write your answer in your own words."})));
      ladder.appendChild(rung(4,"Reteach: another way to think about it",body,fresh?"new retaught":"retaught"));
    }else{
      ladder.appendChild(rung(4,"Reteach: another way to think about it",el("p",{text:sh===3?"Still stuck? This is the last step.":"Locked until you have used all three hints."}),"locked"));
    }
    hrow.innerHTML="";
    var labels=["Help: show hint 1","I need more help: show hint 2","I still need help: show hint 3","Still stuck? Reteach me"];
    if(sh<4){
      hrow.appendChild(el("button",{class:"btn primary",type:"button",text:labels[sh],onclick:function(){shown[d.id]=(shown[d.id]||0)+1;paint(true)}}));
    }
    if(sh>0){
      hrow.appendChild(el("button",{class:"btn",type:"button",text:"Hide hints and reteach",onclick:function(){shown[d.id]=0;paint(false)}}));
    }
    refreshHelp();
  }
  shown[d.id]=st;
  app.appendChild(ladder);app.appendChild(hrow);
  paint(false);

  app.appendChild(el("h2",{class:"sub",text:"Check yourself before you move on"}));
  var cl=el("ul",{class:"checks",id:"checksList"});
  d.c.forEach(function(t,j){
    var id="chk-"+d.id+"-"+j;
    cl.appendChild(el("li",{},el("label",{for:id},el("input",{type:"checkbox",id:id}),el("span",{text:t}))));
  });
  app.appendChild(cl);

  var prev=D[d.idx-1],next=D[d.idx+1];
  app.appendChild(el("div",{class:"navrow"},
    prev?el("button",{class:"btn",type:"button",text:"‹ Previous: "+prev.tag,onclick:function(){go(prev.id)}}):el("span"),
    el("button",{class:"btn primary",type:"button",text:"Back to the index",onclick:function(){go("index")}}),
    next?el("button",{class:"btn",type:"button",text:"Next: "+next.tag+" ›",onclick:function(){go(next.id)}}):el("span")));
}

function viewFigure(k){
  cur={view:"fig",d:null,k:k};
  app.innerHTML="";var f=FIGS[k],j=FIGKEYS.indexOf(k);
  app.appendChild(el("nav",{class:"crumbs","aria-label":"You are here"},
    el("button",{type:"button",text:"Index",onclick:function(){go("index")}}),el("span",{text:"›"}),el("span",{text:f.t})));
  app.appendChild(el("div",{class:"qbox"},el("h1",{id:"pgTitle",tabindex:"-1",text:f.t})));
  app.appendChild(el("p",{class:"lead",text:"Study this until you can recognize every part. Then cover the labels and test yourself."}));
  app.appendChild(figEl(k,false));
  app.appendChild(el("h2",{class:"sub",text:"Questions that use this"}));
  var u=el("div",{class:"usedby",id:"usedBy"});
  f.use.forEach(function(id){var q=BY[id];u.appendChild(el("button",{class:"btn",type:"button",text:q.tag.charAt(0)==="#"?q.tag:q.tag+": "+q.short,onclick:function(){go(id)}}))});
  app.appendChild(u);
  var pv=FIGKEYS[j-1],nx=FIGKEYS[j+1];
  app.appendChild(el("div",{class:"navrow"},
    pv?el("button",{class:"btn",type:"button",text:"‹ Previous diagram",onclick:function(){go("fig-"+pv)}}):el("span"),
    el("button",{class:"btn primary",type:"button",text:"Back to the index",onclick:function(){go("index")}}),
    nx?el("button",{class:"btn",type:"button",text:"Next diagram ›",onclick:function(){go("fig-"+nx)}}):el("span")));
}

function readText(d){
  var t=labOf(d)+". "+d.q+" ";
  if(d.where.length)t+="Where to look. ";
  d.where.forEach(function(x){t+=x[0]+": "+x[1]+". "});
  var k,sh=shown[d.id]||0;for(k=0;k<Math.min(sh,3);k++)t+="Hint "+(k+1)+". "+d.h[k]+" ";
  if(sh>=4)t+="Reteach. "+d.r.join(" ")+" ";
  return t.replace(/_{2,}/g," blank ");
}

/* ---------- "What do I do next?" help on every screen ---------- */
var reduce=false;try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
function helpInfo(){
  var h={next:"",find:null,tip:"",target:null};
  if(cur.view==="index"){
    h.next="Pick the question you are working on. If you are not sure where to start, begin with the first one that is not marked Done.";
    h.tip="Try the question on your paper first. This guide gives you hints, and you do the thinking.";
    h.target=function(){return document.querySelector('.row[data-q="1"][data-done="0"]')||document.getElementById("sortSeg")};
  }else if(cur.view==="fig"){
    h.next="Study this picture or graph. Press one of the question buttons below it to go to a question that uses it.";
    h.find=["Read the labels and look at the shape of each part.","Cover the labels with your hand and try to name each part.","Look for the clues written under each picture."];
    h.tip="Say the name of each part out loud, then check it.";
    h.target=function(){return document.getElementById("usedBy")};
  }else{
    var d=cur.d,sh=shown[d.id]||0;
    if(sh===0)h.next="First, try the question on your paper, even if you only know a little. Then, if you are stuck, press “Help: show hint 1.”";
    else if(sh<3)h.next="Read the hint slowly, then try the question again. Still stuck? Press the button for the next hint.";
    else if(sh===3)h.next="You have used all three hints. Try the question one more time. If you are still stuck, press “Still stuck? Reteach me.”";
    else h.next="Now go back to your paper and write your answer in your own words. Then check yourself with the list below and press “I finished this one.”";
    h.find=["Read the question again and underline the key words.",
      d.where.length?"Look at “Where to look.” Open that paper or look at that diagram.":"This question does not list a place to look. Think about what you learned in class.",
      "Use the hints one at a time. Each one gives you a little more help.",
      "Write your answer in your own words, then use the self-check list."];
    h.tip="Say the question out loud in your own words before you look anything up.";
    h.target=function(){return document.getElementById(sh>=4?"checksList":"helpRow")};
  }
  return h;
}
function refreshHelp(){
  var box=document.getElementById("helpBody");if(!box)return;
  var h=helpInfo();
  box.innerHTML="";
  box.appendChild(el("h3",{text:"Your next step"}));
  box.appendChild(el("p",{text:h.next}));
  if(h.find){
    box.appendChild(el("h3",{text:"How do I find the answer?"}));
    var ol=el("ol",{});h.find.forEach(function(t){ol.appendChild(el("li",{text:t}))});
    box.appendChild(ol);
  }
  box.appendChild(el("p",{class:"small"},el("b",{text:"Hint: "}),h.tip));
}
function showMe(){
  var t=helpInfo().target;t=t&&t();
  if(!t)return;
  try{t.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"})}catch(e){t.scrollIntoView()}
  t.classList.remove("hl");void t.offsetWidth;t.classList.add("hl");
  setTimeout(function(){t.classList.remove("hl")},4500);
}

function focusTitle(){var t=document.getElementById("pgTitle");if(t)t.focus({preventScroll:true})}

function route(){
  stopSpeech();
  var h=(location.hash||"").replace(/^#/,"");
  if(h&&BY[h])viewQuestion(BY[h]);else if(h.indexOf("fig-")===0&&FIGS[h.slice(4)])viewFigure(h.slice(4));else viewIndex();
  document.getElementById("backBtn").hidden=(cur.view==="index");
  refreshHelp();
  window.scrollTo(0,0);focusTitle();
}
window.addEventListener("hashchange",route);

applySettings();
route();

})();
</script>
